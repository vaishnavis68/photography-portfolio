<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery - LensArt Photography</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        nav {
            background: #000;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            color: #f5b942;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #f5b942;
        }

        .title {
            text-align: center;
            padding: 60px;
            background: #1b1b1b;
        }

        .title h2 {
            color: #f5b942;
            font-size: 40px;
        }

        .gallery {
            padding: 60px 8%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .photo {
            background: #222;
            border-radius: 10px;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .photo h3 {
            text-align: center;
            padding: 15px;
            color: #f5b942;
        }

        footer {
            background: #000;
            text-align: center;
            padding: 20px;
            color: #aaa;
        }
    </style>
</head>
